# AMBER CRT lock screen: a mainframe login prompt.
# A solid background instead of a blurred screenshot costs nothing to draw.

source = ~/.config/hypr/colors.conf
$font = DepartureMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = AJSTARS SYSTEMS · TERMINAL 01
    color = $dim
    font_size = 11
    font_family = $font
    position = 24, -16
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $amber
    font_size = 88
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y" | tr a-z A-Z
    color = $dim
    font_size = 22
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = *** SYSTEM LOCKED ***
    color = $hot
    font_size = 11
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 44
    outline_thickness = 2
    rounding = 0
    outer_color = $amber
    inner_color = $bg
    font_color = $amber
    check_color = $hot
    fail_color = $alert
    font_family = $font
    placeholder_text = PASSWORD:
    fail_text = ACCESS DENIED ($ATTEMPTS)
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = > TYPE PASSWORD AND PRESS ENTER_
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
