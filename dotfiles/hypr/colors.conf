# FRESCO LIGHT palette (from the old ceiling-painting wallpaper): the one place these colours are defined for Hyprland and hyprlock.
# Waybar, rofi, mako and the terminals repeat the same hex values.

$bg      = rgb(ece2d0)   # parchment
$surface = rgb(e2d4bd)   # raised panels, title bars
$line    = rgb(cdb99b)   # borders, dividers
$dim     = rgb(8f7759)   # inactive text
$text    = rgb(3d2c1f)   # deep umber text
$accent  = rgb(a7783f)   # ochre accent
$alert   = rgb(a9532f)   # errors, warnings
