# ┌────────────────────────────────────────────────────────────┐
# │  sotto · Hyprland 0.53 · fresco light             │
# │  Keybinds: SUPER+F1   CRT effect: SUPER+SHIFT+C            │
# └────────────────────────────────────────────────────────────┘

source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, 1

$terminal    = kitty
$browser     = firefox
$fileManager = nautilus
$menu        = ~/.config/hypr/scripts/apps.sh
$scripts     = ~/.config/hypr/scripts
$sotto      = ~/Developer/Ayush/sotto      # where this repo lives


#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = mako
# the wallpaper is code: black and empty until summoned (SUPER+H or click the desktop)
exec-once = $sotto/bin/sotto-wall
exec-once = $sotto/bin/sotto-dock
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Amber 24
exec-once = $scripts/crt-mode.sh off
exec-once = $scripts/minimized-watch.py
exec-once = $scripts/snap.py daemon             # drag-to-edge snapping
# make sure the title-bar plugin is loaded, then re-read the config so its settings apply
exec-once = hyprctl plugin list | grep -q hyprbars || { hyprctl plugin load /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprbars.so && hyprctl reload; }


###################
### ENVIRONMENT ###
###################

env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
# VS Code, Cursor, Discord and other Electron apps run natively on Wayland (sharper, lighter)
env = ELECTRON_OZONE_PLATFORM_HINT,auto


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $line
    resize_on_border = true
    extend_border_grab_area = 12   # easier to grab window edges with the mouse

    snap {
        enabled = true            # windows snap to edges and each other when dragged
    }
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0              # square corners, like a real terminal
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false      # keep every window at its true colours
    dim_strength = 0.12

    # Both off on purpose: blur and shadows are the expensive effects on the HD 530
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = snap,   0.2, 0.9, 0.1, 1

    animation = global,      1, 3,   snap
    animation = border,      1, 2,   linear
    animation = windowsIn,   1, 2,   snap,   popin 92%
    animation = windowsOut,  1, 1.5, linear, popin 92%
    animation = windowsMove, 1, 2.5, snap
    animation = fade,        1, 2,   linear
    animation = layers,      1, 2,   snap,   fade
    # workspaces roll vertically, like a CRT losing vertical hold
    animation = workspaces,  1, 2.5, snap,   slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                # redraw only when something changes
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    background_color = rgb(000000)
    focus_on_activate = true      # an app that asks to be shown (e.g. a link opening the browser) comes forward
}

cursor {
    inactive_timeout = 5      # hide the pointer after 5s idle
}


################
### TITLE BARS (hyprbars plugin) ###
################

plugin = /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprbars.so

plugin {
    hyprbars {
        bar_height = 26
        bar_color = rgb(e2d4bd)
        col.text = rgb(3d2c1f)
        bar_text_font = DepartureMono Nerd Font
        bar_text_size = 9
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_button_padding = 7
        icon_on_hover = false            # always show × + – like Windows / macOS
        inactive_button_color = rgb(cdb99b)
        on_double_click = ~/.config/hypr/scripts/bar-action.sh max
        # buttons, right to left: close, maximize, minimize (they act on the bar you click)
        hyprbars-button = rgb(a9532f), 13, ×, ~/.config/hypr/scripts/bar-action.sh close, rgb(ece2d0)
        hyprbars-button = rgb(a7783f), 13, +, ~/.config/hypr/scripts/bar-action.sh max, rgb(ece2d0)
        hyprbars-button = rgb(8f7759), 13, –, ~/.config/hypr/scripts/bar-action.sh min, rgb(ece2d0)
    }
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 2                   # click to focus, like a normal desktop; hover only scrolls
    float_switch_override_focus = 0
    sensitivity = 0
}


###################
### KEYBINDINGS ###
###################

$mod = SUPER

# apps
bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $menu
bind = $mod, D,      exec, $scripts/show-desktop.sh    # show desktop, like Windows
bind = $mod, B,      exec, $browser
bind = $mod, E,      exec, $fileManager

# windows
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, M, exec, $scripts/window-max.sh     # maximize / restore, like Windows and macOS
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, N,       exec, $scripts/minimize.sh hide       # minimize
bind = $mod SHIFT, N, exec, $scripts/minimize.sh restore    # bring back the last minimized

# system
bind = $mod, L,         exec, loginctl lock-session
bind = $mod SHIFT, E,   exec, $scripts/power-menu.sh
bind = $mod SHIFT, V,   exec, cliphist list | rofi -dmenu -p "CLIP>" | cliphist decode | wl-copy
bind = $mod SHIFT, C,   exec, $scripts/crt-mode.sh next
bind = $mod SHIFT, R,   exec, hyprctl reload
bind = $mod, F1,        exec, $scripts/cheatsheet.sh
bind = $mod, H,         exec, $sotto/bin/sotto-toggle
bind = $mod SHIFT, B,   exec, pkill -SIGUSR1 waybar      # hide/show the bar
bind = , Print,         exec, $scripts/screenshot.sh region
bind = SHIFT, Print,    exec, $scripts/screenshot.sh full
bind = CTRL, Print,     exec, $scripts/record.sh region   # press again to stop
bind = CTRL SHIFT, Print, exec, $scripts/record.sh full

# Windows / Ubuntu habits
bind = ALT, TAB,        cyclenext,                  # Alt+Tab: next window (it comes to the front)
bind = ALT SHIFT, TAB,  cyclenext, prev
bind = CTRL ALT, T,     exec, $terminal

# focus / move / resize
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# drop-down scratch workspace: a quick terminal for a Claude session
bind = $mod, grave,       togglespecialworkspace, scratch
bind = $mod SHIFT, grave, movetoworkspace, special:scratch

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause


##############################
### WINDOWS AND WORKSPACES ###
##############################

# A lone window gets the whole 1366x768: no gaps, no border
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
    rounding = 0
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]
    border_size = 0
    rounding = 0
}

# Mouse-first: every window floats like on a normal desktop. Drag by the title
# bar, resize from the edges, maximize with the title-bar button.
windowrule {
    name = float-everything
    match:class = .*
    float = yes
    center = yes
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # from the stock config: fixes dragging in some XWayland apps
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-small-tools
    match:class = ^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$
    float = yes
    size = 720 460
    center = yes
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
    size = 480 270
    move = monitor_w-492 monitor_h-282
}
