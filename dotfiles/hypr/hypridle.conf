general {
    lock_cmd = pidof hyprlock || hyprlock       # never start two lock screens
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the screen with one keypress
}

listener {
    timeout = 600                               # 10 min idle: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                               # 11 min idle: screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# No automatic suspend on purpose: Claude sessions and dev servers keep running.
